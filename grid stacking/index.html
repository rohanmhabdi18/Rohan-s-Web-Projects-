<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Stacking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="child-1"></div>
        <div class="child-2"></div>
        <div class="child-3">SunFlower</div>
        <div class="child-4">
          <p>Like a soul searching for its light, the sunflower follows the sun. It stands tall through changing skies, teaching us to seek the bright side of life and keep growing toward our dreams.</p>
        </div>
        <div class="child-5"></div>
        <div class="child-6"></div>
    </div>

</body>
</html>
